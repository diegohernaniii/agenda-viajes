<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda de Viajes · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/img/icon-192.png">
<meta name="theme-color" content="#163b5e">
<link rel="apple-touch-icon" href="/static/img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda Viajes">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <img src="/static/img/logo.jpg?v={{ asset_version }}" alt="Satlantis Microsats" class="login-logo">
      <h1>Agenda de Viajes</h1>
      <p>Accede con tu usuario para consultar y gestionar los viajes</p>
    </div>
    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="login-form">
      <label>
        Correo electrónico
        <input type="email" name="email" autocomplete="email" required autofocus>
      </label>
      <label>
        Contraseña
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
    <p class="login-alt">¿Primera vez? <a href="/register">Regístrate con tu correo</a></p>
  </div>
<script src="/static/js/pwa.js?v={{ asset_version }}"></script>
</body>
</html>
